# -----------------------------------------------------------------------------
# Ports: immer mit 127.0.0.1:-Praefix veroeffentlichen
#   richtig:  - "127.0.0.1:5432:5432"
#   falsch:   - "5432:5432"
# Ohne Praefix bindet Docker auf ALLE Schnittstellen — die Dienste sind dann samt
# Dev-Zugangsdaten fuer jeden im selben WLAN erreichbar. Die macOS-Firewall
# schuetzt hier nicht, weil Docker Desktop ueber signierte Software durchreicht.
# Zugriff via localhost und zwischen Containern bleibt unveraendert.
# -----------------------------------------------------------------------------
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:22-bookworm
    volumes:
      - ../:/workspaces/zitadel:cached
    command: sleep infinity
    working_dir: /workspaces/zitadel
    environment:
      SHELL: /bin/bash
      DEBIAN_FRONTEND: noninteractive
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      DEVCONTAINER_DB_HOST: db
      DEVCONTAINER_API_HOST: api
      DEVCONTAINER_LOGIN_HOST: login
      DEVCONTAINER_DB_API_INTEGRATION_HOST: db-api-integration
      DEVCONTAINER_DB_FUNCTIONAL_UI_HOST: db-functional-ui
    ports:
      - "127.0.0.1:${ZITADEL_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${ZITADEL_CONSOLE_PORT:-3000}:3000"
      - "127.0.0.1:${ZITADEL_NG_PORT:-4200}:4200"

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - ./.env.db
    volumes:
      - db-data-dev:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: "10s"
      timeout: "30s"
      retries: 5
      start_period: "20s"
    ports:
      - "127.0.0.1:${ZITADEL_DB_PORT:-5432}:5432"

  db-api-integration:
    image: "postgres:18"
    env_file:
      - ./.env.db
    environment:
      PGPORT: 5433
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c shared_buffers=1GB -c work_mem=16MB -c effective_io_concurrency=100 -c wal_level=minimal -c archive_mode=off -c max_wal_senders=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: "10s"
      timeout: "30s"
      retries: 5
      start_period: "20s"
    ports:
      - "127.0.0.1:${ZITADEL_DB_API_PORT:-5433}:5433"

  cache-api-integration:
    image: "redis:8"
    ports:
      - "127.0.0.1:${ZITADEL_CACHE_PORT:-6379}:6379"

  db-functional-ui:
    image: "postgres:18"
    env_file:
      - ./.env.db
    environment:
      PGPORT: 5434
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: "10s"
      timeout: "30s"
      retries: 5
      start_period: "20s"
    ports:
      - "127.0.0.1:${ZITADEL_DB_UI_PORT:-5434}:5434"

volumes:
  db-data-dev:
